<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostics Viewer</title>
<style>
  :root { color-scheme: dark; font: 13px system-ui, sans-serif; background: #202329; color: #dce2eb; }
  body { max-width: 740px; margin: 20px auto; padding: 0 16px; }
  #save-location { color: #9da9bb; font-size: 12px; margin-bottom: 8px; overflow-wrap: anywhere; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 15px; font-weight: 500; margin: 0; white-space: nowrap; }
  h2 { font-size: 13px; font-weight: 500; margin: 12px 0 4px; }
  select { min-width: 0; flex: 1; padding: 5px; background: #292d35; border: 1px solid #454b57; border-radius: 4px; }
  #summary { font-size: 16px; margin-bottom: 5px; }
  #details, #status, #scope-details, .legend { color: #9da9bb; font-size: 12px; }
  #details { white-space: pre-wrap; line-height: 1.6; }
  .legend { margin: 12px 0 4px; }
  .average { color: #76d6b9; } .peak { color: #e2bd6f; }
  .scope-average { color: #f06d76; } .scope-peak { color: #ffabb1; }
  #scope-legend { margin-left: 10px; }
  #scope-details { margin: 0 0 4px; }
  #clear-scope { margin-left: 8px; padding: 2px 6px; font: inherit; color: inherit;
                 background: #292d35; border: 1px solid #454b57; border-radius: 3px; cursor: pointer; }
  canvas { width: 100%; height: 130px; display: block; background: #16191e; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-variant-numeric: tabular-nums; }
  th { color: #9da9bb; font-weight: 400; font-size: 11px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid #333944; }
  th:first-child, td:first-child { text-align: left; }
  .scope-control { display: inline-block; width: 20px; }
  .scope-select { padding: 0; font: inherit; color: inherit; background: transparent;
                  border: 0; text-align: left; cursor: pointer; }
  .scope-select:hover { color: #ffabb1; }
  .scope-selected { background: #38282e; }
  .scope-selected .scope-select { color: #ffabb1; }
  .scope-toggle { width: 16px; height: 16px; padding: 0; line-height: 12px; cursor: pointer;
                  color: inherit; background: #292d35; border: 1px solid #454b57; border-radius: 3px; }
  .scope-toggle:focus-visible, .scope-select:focus-visible, #clear-scope:focus-visible {
    outline: 2px solid #76d6b9; outline-offset: 2px; }
  #status { min-height: 18px; margin-bottom: 8px; }
  pre { height: 120px; overflow: auto; margin: 0; padding: 10px; background: #16191e; border-radius: 4px;
        white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.6 Consolas, monospace; }
</style>
<div id="save-location" title="__SAVE_DIRECTORY_FULL__">Files saved at __SAVE_DIRECTORY__</div>
<header><h1>Diagnostics Viewer</h1><select id="sessions" aria-label="Diagnostics Viewer session"></select></header>
<div id="summary">Waiting for a diagnostics session…</div>
<h2>Live states</h2>
<div id="details">Start an application with diagnostics enabled.</div>
<div class="legend">
  <span id="global-legend"><span class="average">Block average load</span> / <span class="peak">peak load</span></span>
  <span id="scope-legend" hidden><span id="graph-scope"></span>:
    <span class="scope-average">average</span> / <span class="scope-peak">peak (dashed)</span></span>
  · last 30 seconds <button id="clear-scope" type="button" hidden>Whole block</button>
</div>
<div id="scope-details" hidden></div>
<canvas id="graph" aria-label="Block load history"></canvas>
<table>
  <thead><tr><th>Block scope</th><th>Self ms/block</th><th>Total ms/block</th><th>Calls/block</th></tr></thead>
  <tbody id="scopes"></tbody>
</table>
<div id="status">Waiting for a session.</div>
<pre id="logs" aria-label="Recent diagnostic logs"></pre>
<script>
  const element = id => document.getElementById(id);
  let selected = '', offset = 0, closed = false, latest = null, lastUpdate = 0, lastScan = 0;
  let history = [], logs = [];
  let selectedScopeId = null;
  const expandedScopes = new Set(), executedScopes = new Set(), scopeRows = new Map();

  function select(name) {
    selected = name; offset = 0; closed = false; latest = null; lastUpdate = 0;
    history = []; logs = [];
    selectedScopeId = null;
    expandedScopes.clear(); executedScopes.clear(); scopeRows.clear();
    element('logs').textContent = ''; element('scopes').replaceChildren();
    element('summary').textContent = 'Waiting for measurements…';
    element('details').textContent = 'Start an application with diagnostics enabled.';
    draw();
  }
  element('sessions').addEventListener('change', event => select(event.target.value));
  element('clear-scope').addEventListener('click', () => selectScope(null));

  function selectScope(id) {
    selectedScopeId = id;
    renderScopes(); draw();
  }

  function scopeLoads(item) {
    return new Map((item.scopes || []).map((scope, index) => {
      const id = scope.id ?? index;
      // Older recordings allow an exact average from the whole block's budget ratio.
      const average = scope.load ?? (id === 0 ? item.load :
        (item.mean_ms > 0 ? item.load * scope.total_ms / item.mean_ms : 0));
      const peak = scope.peak_load ?? (id === 0 ? item.peak_load : null);
      return [id, { average, peak }];
    }));
  }

  async function scan() {
    const response = await fetch('/api/sessions');
    if (!response.ok) throw new Error('Session list unavailable');
    const sessions = await response.json();
    const selector = element('sessions');
    selector.replaceChildren();
    for (const session of sessions) {
      const option = document.createElement('option');
      option.value = session.name;
      option.textContent = `${session.application || 'Application'} · PID ${session.pid ?? '?'} · #${session.instance ?? '?'} · ${session.name}`;
      selector.append(option);
    }
    if (sessions.length && (!sessions.some(item => item.name === selected) ||
                            (closed && sessions[0].name !== selected))) select(sessions[0].name);
    if (selected) selector.value = selected;
  }

  function metrics(item) {
    latest = item; lastUpdate = performance.now();
    history.push({ time: item.time, average: item.load, peak: item.peak_load, scopes: scopeLoads(item) });
    history = history.filter(point => point.time >= item.time - 30).slice(-120);
    element('summary').textContent = `Block load ${item.load.toFixed(1)}% · peak ${item.peak_load.toFixed(1)}% · avg ${item.mean_ms.toFixed(3)} / p99 ${item.p99_ms.toFixed(3)} ms`;
    const values = item.values || {};
    element('details').textContent = Object.entries(values)
      .map(([key, value]) => `${key.replaceAll('_', ' ')}: ${value}`).join('\n');
    renderScopes();
    draw();
  }

  function renderScopes() {
    const table = element('scopes');
    const nodes = (latest?.scopes || []).map((scope, index) => {
      const id = scope.id ?? index;
      // Recorded parents and total_blocks preserve execution evidence in idle sessions.
      if (scope.calls_per_block > 0 || scope.parents?.length > 0 ||
          (id === 0 && latest.total_blocks > 0)) executedScopes.add(id);
      // Older recordings only distinguish the whole block from its inner scopes.
      const parents = scope.parents ?? (index ? [0] : []);
      return { scope, id, parent: parents.length === 1 ? parents[0] : null,
               children: [], shared: parents.length > 1 };
    }).filter(node => executedScopes.has(node.id));
    const byId = new Map(nodes.map(node => [node.id, node]));
    if (!byId.has(selectedScopeId)) selectedScopeId = null;
    for (const node of nodes) {
      const ancestors = new Set([node.id]);
      let parent = byId.get(node.parent);
      while (parent) {
        if (ancestors.has(parent.id)) { node.parent = null; break; }
        ancestors.add(parent.id);
        parent = byId.get(parent.parent);
      }
    }
    const roots = [];
    for (const node of nodes) {
      const parent = byId.get(node.parent);
      if (parent) parent.children.push(node); else roots.push(node);
    }
    const ordered = [];
    function visit(node, depth, visible) {
      ordered.push({ node, depth, visible });
      for (const child of node.children) visit(child, depth + 1, visible && expandedScopes.has(node.id));
    }
    for (const root of roots) visit(root, 0, true);
    for (const [index, { node, depth, visible }] of ordered.entries()) {
      let entry = scopeRows.get(node.id);
      if (!entry) {
        const row = document.createElement('tr'), nameCell = document.createElement('td');
        const control = document.createElement('span'), toggle = document.createElement('button');
        control.className = 'scope-control'; toggle.className = 'scope-toggle'; toggle.type = 'button';
        toggle.addEventListener('click', () => {
          if (expandedScopes.has(node.id)) expandedScopes.delete(node.id); else expandedScopes.add(node.id);
          renderScopes();
        });
        const label = document.createElement('button');
        label.className = 'scope-select'; label.type = 'button';
        label.addEventListener('click', () => selectScope(selectedScopeId === node.id ? null : node.id));
        control.append(toggle); nameCell.append(control, label); row.append(nameCell);
        const cells = Array.from({ length: 3 }, () => document.createElement('td'));
        row.append(...cells);
        entry = { row, nameCell, toggle, label, cells }; scopeRows.set(node.id, entry);
      }
      const expanded = expandedScopes.has(node.id);
      entry.row.hidden = !visible;
      entry.row.className = selectedScopeId === node.id ? 'scope-selected' : '';
      entry.nameCell.style.paddingLeft = `${8 + depth * 18}px`;
      entry.label.textContent = node.scope.name;
      entry.label.title = node.shared ? 'Timings combined across multiple parents.' : '';
      entry.label.setAttribute('aria-pressed', String(selectedScopeId === node.id));
      entry.label.setAttribute('aria-label', `View load history for ${node.scope.name}`);
      entry.toggle.hidden = node.children.length === 0;
      entry.toggle.textContent = expanded ? '−' : '+';
      entry.toggle.setAttribute('aria-expanded', String(expanded));
      entry.toggle.setAttribute('aria-label', `${expanded ? 'Collapse' : 'Expand'} ${node.scope.name}`);
      [node.scope.self_ms.toFixed(4), node.scope.total_ms.toFixed(4), node.scope.calls_per_block.toFixed(1)]
        .forEach((text, column) => { entry.cells[column].textContent = text; });
      if (table.children[index] !== entry.row) table.insertBefore(entry.row, table.children[index] || null);
    }
    for (const [id, entry] of scopeRows) {
      if (!byId.has(id)) { entry.row.remove(); scopeRows.delete(id); }
    }
  }

  function draw() {
    const canvas = element('graph'), ratio = window.devicePixelRatio || 1;
    const scope = (latest?.scopes || []).find((scope, index) => (scope.id ?? index) === selectedScopeId);
    const focused = selectedScopeId !== null && !!scope;
    element('global-legend').style.opacity = focused ? '0.35' : '1';
    element('scope-legend').hidden = !focused;
    element('clear-scope').hidden = !focused;
    element('scope-details').hidden = !focused;
    element('graph-scope').textContent = scope?.name || '';
    canvas.setAttribute('aria-label', focused ? `${scope.name} and block load history` : 'Block load history');
    if (focused) {
      const loads = history.at(-1)?.scopes.get(selectedScopeId);
      const format = value => Number.isFinite(value) ? `${value.toFixed(1)}%` : 'unavailable in this recording';
      element('scope-details').textContent = `Average ${format(loads?.average)} · peak ${format(loads?.peak)} · total including children`;
    } else element('scope-details').textContent = '';
    const width = canvas.clientWidth, height = canvas.clientHeight;
    canvas.width = width * ratio; canvas.height = height * ratio;
    const ctx = canvas.getContext('2d'); ctx.scale(ratio, ratio);
    const left = 40, right = width - 10, top = 10, bottom = height - 12;
    const series = [
      { value: point => point.average, color: '#76d6b9', alpha: focused ? 0.25 : 1 },
      { value: point => point.peak, color: '#e2bd6f', alpha: focused ? 0.25 : 1 },
    ];
    if (focused) series.push(
      { value: point => point.scopes.get(selectedScopeId)?.average, color: '#f06d76', alpha: 1 },
      { value: point => point.scopes.get(selectedScopeId)?.peak, color: '#ffabb1', alpha: 1, dashed: true });
    const scale = Math.max(100, ...series.flatMap(trace => history.map(point => {
      const value = trace.value(point);
      return Number.isFinite(value) ? value * 1.1 : 0;
    })));
    const y = value => bottom - value / scale * (bottom - top);
    ctx.strokeStyle = '#8f454b'; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(left, y(100)); ctx.lineTo(right, y(100)); ctx.stroke();
    ctx.fillStyle = '#d0878d'; ctx.font = '10px system-ui'; ctx.fillText('100%', 3, y(100) + 3);
    ctx.setLineDash([]);
    const end = history.length ? history.at(-1).time : 30;
    for (const trace of series) {
      ctx.strokeStyle = trace.color; ctx.globalAlpha = trace.alpha;
      ctx.lineWidth = focused && trace.alpha === 1 ? 2 : 1.5;
      ctx.setLineDash(trace.dashed ? [5, 3] : []); ctx.beginPath();
      let connected = false;
      history.forEach(point => {
        const value = trace.value(point);
        if (!Number.isFinite(value)) { connected = false; return; }
        const x = right - (end - point.time) / 30 * (right - left);
        if (connected) ctx.lineTo(x, y(value)); else ctx.moveTo(x, y(value));
        connected = true;
      });
      ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.setLineDash([]);
  }
  window.addEventListener('resize', draw);

  async function tick() {
    try {
      const now = performance.now();
      if (now - lastScan >= 1000 || !lastScan) { await scan(); lastScan = now; }
      if (selected) {
        const requestedSession = selected;
        const response = await fetch(`/api/poll?session=${encodeURIComponent(requestedSession)}&offset=${offset}`);
        if (!response.ok) throw new Error('Session unavailable');
        const chunk = await response.json();
        if (requestedSession !== selected) { setTimeout(tick, 0); return; }
        if (chunk.reset) select(selected);
        offset = chunk.offset;
        for (const item of chunk.records) {
          if (item.type === 'metrics') metrics(item);
          else if (item.type === 'log') logs.push(`${item.time.toFixed(2).padStart(8)}s [${item.level}] ${item.text}`);
          else if (item.type === 'closed') closed = true;
        }
        logs = logs.slice(-200);
        const log = element('logs');
        const follow = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
        log.textContent = logs.join('\n');
        if (follow) log.scrollTop = log.scrollHeight;
        let status = closed ? 'Closed' : (now - lastUpdate > 3000 ? 'Writer inactive' :
                     (!latest || latest.blocks === 0 ? 'Idle' : 'Live'));
        if (latest) status += ` · max ${latest.lifetime_peak_ms.toFixed(3)} ms · over budget ${latest.over_budget} · dropped blocks/logs ${latest.dropped_blocks}/${latest.dropped_logs}`;
        element('status').textContent = status;
      }
    } catch (error) { element('status').textContent = `Waiting: ${error.message}`; }
    setTimeout(tick, 200);
  }
  draw(); tick();
</script>
</html>
